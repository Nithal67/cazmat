<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAZMAT | Questions Fréquentes (FAQ)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Montserrat"', 'sans-serif'] },
                    colors: {
                        brand: {
                            red: '#F57927',
                            dark: '#0A0A0A',
                            card: '#121212',
                            border: '#262626'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-brand-dark text-gray-200 font-sans antialiased flex flex-col min-h-screen">

    <header class="bg-black/90 backdrop-blur-md sticky top-0 z-50 border-b border-brand-border">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3 group">
                <img src="images/logo.png" alt="Logo CAZMAT" class="w-9 h-9 object-contain group-hover:scale-105 transition-transform duration-300">
                <span class="font-bold tracking-wider text-white text-xl uppercase">CAZMAT</span>
            </a>
            <nav class="hidden md:flex items-center gap-8 text-xs font-semibold uppercase tracking-widest text-gray-300">
                <a href="index.html" class="hover:text-brand-red transition-colors">Accueil</a>
                <a href="packs.html" class="hover:text-brand-red transition-colors">Pack Essentiels</a>
                <a href="maintenance.html" class="hover:text-brand-red transition-colors">Maintenance</a>
                <a href="faq.html" class="text-brand-red font-bold">FAQ</a>
                <a href="contact.html" class="hover:text-brand-red transition-colors">Contact</a>
            </nav>
            <a href="dashboard.html" class="border border-brand-red text-brand-red hover:bg-brand-red hover:text-white px-5 py-2.5 text-xs font-bold uppercase tracking-wider transition duration-300">
                Résilier
            </a>
        </div>
    </header>

    <main class="flex-grow py-16 px-6 max-w-4xl mx-auto w-full">
        <div class="text-center mb-16 space-y-3">
            <span class="text-xs font-bold uppercase tracking-[0.2em] text-brand-red">Assistance & Support</span>
            <h1 class="text-3xl md:text-5xl font-extrabold uppercase tracking-tight text-white">Foire Aux Questions</h1>
            <p class="text-gray-400 text-xs md:text-sm font-light">Toutes les réponses à vos questions sur nos services à Duppigheim.</p>
        </div>

        <div id="faq-container" class="space-y-4">
            <div class="bg-brand-card border border-brand-border p-8 text-center text-gray-400 text-xs uppercase tracking-wider">
                <i class="fa-solid fa-circle-notch fa-spin text-brand-red mr-2"></i> Chargement des questions...
            </div>
        </div>
    </main>

<footer class="bg-black text-gray-500 py-10 text-center text-xs uppercase tracking-widest border-t border-brand-border mt-auto space-y-3">
        <p>&copy; 2026 - CAZMAT (Duppigheim). Tous droits réservés.</p>
        <div class="flex justify-center gap-6 text-[11px]">
            <a href="mentions-legales.html" class="hover:text-brand-red transition-colors">Mentions Légales</a>
            <a href="cgv.html" class="hover:text-brand-red transition-colors">CGV</a>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const faqContainer = document.getElementById('faq-container');
            try {
                const response = await fetch('faq.json');
                const data = await response.json();
                faqContainer.innerHTML = '';
                data.forEach(item => {
                    faqContainer.innerHTML += `
                        <div class="bg-brand-card border border-brand-border p-8 space-y-3 hover:border-brand-red/50 transition duration-300">
                            <h3 class="font-bold text-sm uppercase tracking-wider text-white flex items-center gap-3">
                                <i class="fa-solid fa-chevron-right text-brand-red text-xs"></i>
                                ${item.question}
                            </h3>
                            <p class="text-xs text-gray-400 leading-relaxed font-light pl-6">${item.answer}</p>
                        </div>
                    `;
                });
            } catch (err) {
                faqContainer.innerHTML = `<div class="bg-brand-card border border-brand-border p-8 text-xs text-brand-red uppercase tracking-wider">Impossible de charger la FAQ.</div>`;
            }
        });
    </script>
</body>
</html>
